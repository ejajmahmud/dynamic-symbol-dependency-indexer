[build-system]
requires = ["setuptools>=61.0"]
build-backend = "setuptools.build_meta"

[project]
name = "dynamic-symbol-dependency-indexer"
version = "0.1.0"
description = "High-speed in-memory symbol definition, import topology, and reference resolver for large Python codebases"
readme = "README.md"
requires-python = ">=3.9"
license = {text = "MIT"}
authors = [
    {name = "Ejaj Mahmud", email = "dev@ejajmahmud.com"}
]
classifiers = [
    "Development Status :: 4 - Beta",
    "Intended Audience :: Developers",
    "License :: OSI Approved :: MIT License",
    "Programming Language :: Python :: 3",
]
dependencies = []

[project.scripts]
dynamic-symbol-dependency-indexer = "dynamic_symbol_dependency_indexer.cli:main"

[tool.setuptools.packages.find]
where = ["."]
include = ["dynamic_symbol_dependency_indexer*"]
